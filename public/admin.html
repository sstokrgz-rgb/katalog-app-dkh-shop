<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DKH SHOP MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-overlay { opacity:0; pointer-events:none; transition: opacity 0.3s ease; }
        .modal-overlay.open { opacity:1; pointer-events:all; }
        .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards; }
        @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes fadeOut { from{opacity:1} to{opacity:0} }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Toast -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[999] flex flex-col gap-2"></div>

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 mx-auto mb-6">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white mb-2">Admin Panel</h1>
            <p class="text-sm text-slate-400 mb-6">DKH SHOP MARKET</p>
            <div class="space-y-4">
                <input type="password" id="loginPassword" placeholder="Masukkan password admin"
                    class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    onkeydown="if(event.key==='Enter')login()">
                <button onclick="login()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold hover:shadow-lg hover:shadow-indigo-500/40 transition-all">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk
                </button>
                <p id="loginError" class="hidden text-sm text-red-400 font-medium"></p>
            </div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard" class="hidden">
        <!-- Header -->
        <header class="glass sticky top-0 z-50 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                            <i class="fa-solid fa-gauge-high text-lg"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-extrabold text-white">DKH SHOP <span class="text-indigo-400">ADMIN</span></h1>
                            <p class="text-xs text-slate-400">Panel Manajemen Order</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="loadOrders()" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition text-sm font-medium" title="Refresh">
                            <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh
                        </button>
                        <button onclick="logout()" class="px-4 py-2 rounded-xl bg-red-500/20 border border-red-500/30 text-red-400 hover:bg-red-500/30 transition text-sm font-medium">
                            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-box text-xl text-indigo-400"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">Total Order</p>
                            <p id="statTotal" class="text-2xl font-extrabold text-white">0</p>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-hourglass-half text-xl text-amber-400"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">Menunggu Verifikasi</p>
                            <p id="statPending" class="text-2xl font-extrabold text-amber-400">0</p>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-check-circle text-xl text-emerald-400"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">Dikonfirmasi</p>
                            <p id="statConfirmed" class="text-2xl font-extrabold text-emerald-400">0</p>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-red-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-times-circle text-xl text-red-400"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">Ditolak</p>
                            <p id="statRejected" class="text-2xl font-extrabold text-red-400">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter & Search -->
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex flex-wrap gap-2">
                    <button onclick="setFilter('all')" class="filter-btn active px-4 py-2 rounded-xl text-sm font-semibold transition" data-filter="all">
                        Semua
                    </button>
                    <button onclick="setFilter('pending_payment')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition" data-filter="pending_payment">
                        💰 Menunggu Bayar
                    </button>
                    <button onclick="setFilter('pending_verification')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition" data-filter="pending_verification">
                        ⏳ Menunggu Verifikasi
                    </button>
                    <button onclick="setFilter('confirmed')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition" data-filter="confirmed">
                        ✅ Dikonfirmasi
                    </button>
                    <button onclick="setFilter('rejected')" class="filter-btn px-4 py-2 rounded-xl text-sm font-semibold transition" data-filter="rejected">
                        ❌ Ditolak
                    </button>
                </div>
                <div class="flex-grow">
                    <input type="text" id="searchOrders" placeholder="Cari nomor order atau nama..."
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                        oninput="renderOrders()">
                </div>
            </div>

            <!-- Orders List -->
            <div id="ordersList" class="space-y-4">
                <!-- Rendered via JS -->
            </div>

            <div id="noOrders" class="hidden text-center py-16">
                <i class="fa-solid fa-inbox text-5xl text-slate-600 mb-4"></i>
                <p class="text-slate-500 font-medium">Belum ada order</p>
            </div>
        </main>
    </div>

    <!-- ===== ORDER DETAIL MODAL ===== -->
    <div id="detailOverlay" class="modal-overlay fixed inset-0 bg-black/70 z-[80] flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-3xl w-full max-w-2xl max-h-[95vh] overflow-y-auto shadow-2xl border border-slate-700/50">
            <div class="p-6 border-b border-slate-700 flex items-center justify-between sticky top-0 bg-slate-900 rounded-t-3xl z-10">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-indigo-400"></i> Detail Order
                </h2>
                <button onclick="closeDetailModal()" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="detailContent" class="p-6 space-y-5">
                <!-- Filled via JS -->
            </div>
        </div>
    </div>

    <!-- ===== REJECT REASON MODAL ===== -->
    <div id="rejectOverlay" class="modal-overlay fixed inset-0 bg-black/70 z-[90] flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-3xl w-full max-w-md shadow-2xl border border-slate-700/50 p-6">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-ban text-red-400"></i> Tolak Order
            </h2>
            <p class="text-sm text-slate-400 mb-4">Masukkan alasan penolakan:</p>
            <textarea id="rejectReason" rows="3" placeholder="Contoh: Bukti transfer tidak valid"
                class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500 resize-none mb-4"></textarea>
            <div class="flex gap-3">
                <button onclick="closeRejectModal()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 font-bold hover:bg-slate-700 transition">
                    Batal
                </button>
                <button onclick="confirmReject()" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold hover:bg-red-600 transition">
                    <i class="fa-solid fa-ban mr-1"></i> Tolak
                </button>
            </div>
        </div>
    </div>

    <!-- ===== LIGHTBOX ===== -->
    <div id="lightbox" class="modal-overlay fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl">
        <button class="absolute top-4 right-4 w-12 h-12 rounded-full bg-white/10 text-white flex items-center justify-center text-xl hover:bg-white/20 transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <script>
        // ===== STATE =====
        let adminPassword = sessionStorage.getItem('dkh_admin_password') || '';
        let orders = [];
        let currentFilter = 'all';
        let rejectingOrderId = null;
        let previousPendingCount = 0;
        let autoRefreshInterval = null;

        const formatRp = (n) => new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n);

        // ===== TOAST =====
        function showToast(message, type='success') {
            const colors = { success:'bg-emerald-500', error:'bg-red-500', info:'bg-indigo-500', warning:'bg-amber-500' };
            const icons = { success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle', warning:'fa-exclamation-triangle' };
            const t = document.createElement('div');
            t.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium`;
            t.innerHTML = `<i class="fa-solid ${icons[type]}"></i> ${message}`;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ===== BEEP SOUND =====
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = 1100;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.3;
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.3);
                }, 250);
            } catch(e) {}
        }

        // ===== AUTH =====
        async function login() {
            const pw = document.getElementById('loginPassword').value.trim();
            if (!pw) { document.getElementById('loginError').textContent = 'Password tidak boleh kosong!'; document.getElementById('loginError').classList.remove('hidden'); return; }

            try {
                const res = await fetch('/api/admin/orders', { headers: { 'x-admin-password': pw } });
                if (res.ok) {
                    adminPassword = pw;
                    sessionStorage.setItem('dkh_admin_password', pw);
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    await loadOrders();
                    startAutoRefresh();
                } else {
                    document.getElementById('loginError').textContent = 'Password salah!';
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch(e) {
                document.getElementById('loginError').textContent = 'Gagal terhubung ke server!';
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logout() {
            adminPassword = '';
            sessionStorage.removeItem('dkh_admin_password');
            stopAutoRefresh();
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        // ===== AUTO REFRESH =====
        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshInterval = setInterval(loadOrders, 30000);
        }
        function stopAutoRefresh() {
            if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
        }

        // ===== ORDERS =====
        async function loadOrders() {
            try {
                const res = await fetch('/api/admin/orders', { headers: { 'x-admin-password': adminPassword } });
                const json = await res.json();
                if (json.success) {
                    orders = json.data;
                    updateStats();
                    renderOrders();

                    // Cek order baru pending verification
                    const pendingCount = orders.filter(o => o.status === 'pending_verification').length;
                    if (pendingCount > previousPendingCount && previousPendingCount >= 0) {
                        playBeep();
                        showToast(`${pendingCount - previousPendingCount} order baru menunggu verifikasi!`, 'warning');
                    }
                    previousPendingCount = pendingCount;

                    // Update page title
                    document.title = pendingCount > 0 ? `(${pendingCount}) Admin - DKH SHOP` : 'Admin Panel - DKH SHOP MARKET';
                }
            } catch(e) {
                console.error('Gagal memuat orders:', e);
            }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = orders.length;
            document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending_verification').length;
            document.getElementById('statConfirmed').textContent = orders.filter(o => o.status === 'confirmed').length;
            document.getElementById('statRejected').textContent = orders.filter(o => o.status === 'rejected').length;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = btn.dataset.filter === filter;
                btn.classList.toggle('bg-indigo-500', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('bg-slate-800', !isActive);
                btn.classList.toggle('text-slate-400', !isActive);
                btn.classList.toggle('border', !isActive);
                btn.classList.toggle('border-slate-700', !isActive);
            });
            renderOrders();
        }

        function getFilteredOrders() {
            let filtered = orders;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => o.status === currentFilter);
            }
            const search = (document.getElementById('searchOrders')?.value || '').toLowerCase();
            if (search) {
                filtered = filtered.filter(o =>
                    o.order_number.toLowerCase().includes(search) ||
                    o.customer_name.toLowerCase().includes(search) ||
                    o.customer_phone.includes(search)
                );
            }
            return filtered;
        }

        function renderOrders() {
            const filtered = getFilteredOrders();
            const container = document.getElementById('ordersList');
            const noOrders = document.getElementById('noOrders');

            if (filtered.length === 0) {
                container.innerHTML = '';
                noOrders.classList.remove('hidden');
                return;
            }
            noOrders.classList.add('hidden');

            container.innerHTML = filtered.map(order => {
                const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
                const statusCfg = getStatusConfig(order.status);
                const itemNames = items.map(i => `${i.product_name} x${i.qty}`).join(', ');
                const date = new Date(order.created_at).toLocaleString('id-ID');

                return `
                    <div class="glass rounded-2xl p-5 hover:border-indigo-500/30 transition cursor-pointer" onclick="showDetail('${order.id}')">
                        <div class="flex flex-col md:flex-row md:items-center gap-4">
                            <!-- Info Utama -->
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="text-lg font-extrabold text-white">${order.order_number}</span>
                                    <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-${statusCfg.color}-500/20 text-${statusCfg.color}-400 border border-${statusCfg.color}-500/30">
                                        ${statusCfg.icon} ${statusCfg.label}
                                    </span>
                                </div>
                                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-slate-400">
                                    <span><i class="fa-solid fa-user mr-1 text-slate-500"></i> ${order.customer_name}</span>
                                    <a href="https://wa.me/${order.customer_phone.replace(/^0/,'62').replace(/[^0-9]/g,'')}" target="_blank" class="text-emerald-400 hover:underline" onclick="event.stopPropagation()">
                                        <i class="fa-brands fa-whatsapp mr-1"></i> ${order.customer_phone}
                                    </a>
                                    <span><i class="fa-solid fa-clock mr-1 text-slate-500"></i> ${date}</span>
                                </div>
                                <p class="text-xs text-slate-500 mt-1 truncate">🛍️ ${itemNames}</p>
                            </div>

                            <!-- Harga & Aksi -->
                            <div class="flex items-center gap-3 flex-shrink-0">
                                <div class="text-right">
                                    <p class="text-xl font-black text-indigo-400">${formatRp(order.total_amount)}</p>
                                </div>
                                ${order.payment_proof ? `
                                    <img src="${order.payment_proof}" class="w-14 h-14 object-cover rounded-xl border border-slate-700 cursor-pointer hover:opacity-80 transition"
                                        onclick="event.stopPropagation();openLightbox('${order.payment_proof}')" title="Lihat bukti TF">
                                ` : '<div class="w-14 h-14 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-600 text-xs">No img</div>'}
                                ${order.status === 'pending_verification' ? `
                                    <div class="flex flex-col gap-1" onclick="event.stopPropagation()">
                                        <button onclick="confirmOrder('${order.id}')" class="px-3 py-2 rounded-lg bg-emerald-500 text-white text-xs font-bold hover:bg-emerald-600 transition">✅ ACC</button>
                                        <button onclick="openRejectModal('${order.id}')" class="px-3 py-2 rounded-lg bg-red-500 text-white text-xs font-bold hover:bg-red-600 transition">❌ Tolak</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusConfig(status) {
            const map = {
                'pending_payment':      { color:'amber',   icon:'💰', label:'Menunggu Bayar' },
                'pending_verification': { color:'blue',    icon:'⏳', label:'Menunggu Verifikasi' },
                'confirmed':            { color:'emerald', icon:'✅', label:'Dikonfirmasi' },
                'rejected':             { color:'red',     icon:'❌', label:'Ditolak' },
                'completed':            { color:'purple',  icon:'🏆', label:'Selesai' }
            };
            return map[status] || map['pending_payment'];
        }

        // ===== DETAIL MODAL =====
        function showDetail(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
            const statusCfg = getStatusConfig(order.status);

            document.getElementById('detailContent').innerHTML = `
                <!-- Status -->
                <div class="text-center py-4">
                    <span class="px-4 py-2 rounded-xl text-sm font-bold bg-${statusCfg.color}-500/20 text-${statusCfg.color}-400 border border-${statusCfg.color}-500/30">
                        ${statusCfg.icon} ${statusCfg.label}
                    </span>
                </div>

                <!-- Info Order -->
                <div class="glass rounded-2xl p-5 space-y-3">
                    <h3 class="font-bold text-white text-lg mb-3">📋 Info Order</h3>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div><span class="text-slate-400">No. Order:</span><p class="font-bold text-white">${order.order_number}</p></div>
                        <div><span class="text-slate-400">Tanggal:</span><p class="font-bold text-white">${new Date(order.created_at).toLocaleString('id-ID')}</p></div>
                        <div><span class="text-slate-400">Nama:</span><p class="font-bold text-white">${order.customer_name}</p></div>
                        <div><span class="text-slate-400">WhatsApp:</span>
                            <p><a href="https://wa.me/${order.customer_phone.replace(/^0/,'62').replace(/[^0-9]/g,'')}" target="_blank" class="font-bold text-emerald-400 hover:underline">${order.customer_phone}</a></p>
                        </div>
                        ${order.customer_email ? `<div class="col-span-2"><span class="text-slate-400">Email:</span><p class="font-bold text-white">${order.customer_email}</p></div>` : ''}
                    </div>
                </div>

                <!-- Items -->
                <div class="glass rounded-2xl p-5">
                    <h3 class="font-bold text-white text-lg mb-3">🛍️ Produk Dipesan</h3>
                    <div class="space-y-2">
                        ${items.map(item => `
                            <div class="flex justify-between items-center py-2 border-b border-slate-700/50 last:border-0">
                                <div>
                                    <p class="text-sm font-semibold text-white">${item.product_name}</p>
                                    <p class="text-xs text-slate-400">${formatRp(item.price)} × ${item.qty}</p>
                                </div>
                                <p class="font-bold text-indigo-400">${formatRp(item.subtotal)}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-600 flex justify-between">
                        <span class="text-lg font-bold text-white">Total:</span>
                        <span class="text-2xl font-black text-indigo-400">${formatRp(order.total_amount)}</span>
                    </div>
                </div>

                <!-- Bukti Transfer -->
                ${order.payment_proof ? `
                    <div class="glass rounded-2xl p-5">
                        <h3 class="font-bold text-white text-lg mb-3">📸 Bukti Transfer</h3>
                        <img src="${order.payment_proof}" class="w-full max-h-96 object-contain rounded-xl border border-slate-700 cursor-pointer hover:opacity-90 transition"
                            onclick="openLightbox('${order.payment_proof}')">
                    </div>
                ` : ''}

                <!-- Reject Reason -->
                ${order.reject_reason ? `
                    <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-5">
                        <h3 class="font-bold text-red-400 mb-2"><i class="fa-solid fa-ban mr-1"></i> Alasan Penolakan</h3>
                        <p class="text-sm text-red-300">${order.reject_reason}</p>
                    </div>
                ` : ''}

                <!-- Aksi -->
                ${order.status === 'pending_verification' ? `
                    <div class="flex gap-3">
                        <button onclick="confirmOrder('${order.id}');closeDetailModal()" class="flex-1 py-3 rounded-xl bg-emerald-500 text-white font-bold hover:bg-emerald-600 transition text-lg">
                            ✅ Konfirmasi Pembayaran
                        </button>
                        <button onclick="openRejectModal('${order.id}');closeDetailModal()" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold hover:bg-red-600 transition text-lg">
                            ❌ Tolak
                        </button>
                    </div>
                ` : ''}
            `;

            document.getElementById('detailOverlay').classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detailOverlay').classList.remove('open');
        }

        // ===== CONFIRM / REJECT =====
        async function confirmOrder(orderId) {
            try {
                const res = await fetch(`/api/admin/orders/${orderId}/confirm`, {
                    method: 'POST',
                    headers: { 'x-admin-password': adminPassword }
                });
                const json = await res.json();
                if (json.success) {
                    showToast('Order berhasil dikonfirmasi! ✅');
                    await loadOrders();
                } else {
                    showToast(json.message || 'Gagal konfirmasi!', 'error');
                }
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        function openRejectModal(orderId) {
            rejectingOrderId = orderId;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectOverlay').classList.add('open');
        }

        function closeRejectModal() {
            rejectingOrderId = null;
            document.getElementById('rejectOverlay').classList.remove('open');
        }

        async function confirmReject() {
            if (!rejectingOrderId) return;
            const reason = document.getElementById('rejectReason').value.trim();
            if (!reason) { showToast('Masukkan alasan penolakan!', 'error'); return; }

            try {
                const res = await fetch(`/api/admin/orders/${rejectingOrderId}/reject`, {
                    method: 'POST',
                    headers: { 'x-admin-password': adminPassword, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason })
                });
                const json = await res.json();
                if (json.success) {
                    showToast('Order ditolak ❌');
                    closeRejectModal();
                    await loadOrders();
                } else {
                    showToast(json.message || 'Gagal menolak!', 'error');
                }
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        // ===== LIGHTBOX =====
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('open');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        // ===== INIT =====
        // Auto login jika sudah ada password tersimpan
        if (adminPassword) {
            login();
        }

        // Set initial filter style
        setFilter('all');
    </script>
</body>
</html>
